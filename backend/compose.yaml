# "services" lista os containers que compõem o sistema.
services:

  # ---------- Serviço da API (Laravel) ----------
  api:
    # Em vez de usar uma imagem pronta, constrói a imagem a partir de um Dockerfile.
    build:
      context: .                    # pasta usada como base do build (a atual)
      dockerfile: Dockerfile.dev    # qual Dockerfile usar (o de desenvolvimento)

    # Formato "porta_do_seu_computador:porta_do_container".
    # Assim http://localhost:8000 no navegador chega na porta 8000 do container.
    ports:
      - "8000:8000"

    # Carrega todas as variáveis do arquivo .env para dentro do container.
    # É assim que o Laravel recebe DB_HOST, DB_USERNAME etc.
    env_file: .env

    # Bind mount: espelha a pasta atual do seu computador em /var/www/html no container.
    # Quando você edita um arquivo no editor, o container já enxerga a mudança,
    # sem precisar reconstruir a imagem.
    volumes:
      - .:/var/www/html

    # Só inicia a API depois que o banco estiver "saudável" (veja o healthcheck abaixo).
    # Sem isso, a API poderia subir antes do MySQL estar pronto e falhar ao conectar.
    depends_on:
      db:
        condition: service_healthy

  # ---------- Serviço do banco de dados (MySQL) ----------
  db:
    # Aqui usamos uma imagem pronta do Docker Hub, sem Dockerfile.
    image: mysql:8.0

    # Variáveis que a imagem do MySQL lê na PRIMEIRA vez que o banco é criado.
    # Os valores ${...} são puxados do seu arquivo .env.
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}     # cria o banco "loja"
      MYSQL_USER: ${DB_USERNAME}         # cria o usuário da aplicação
      MYSQL_PASSWORD: ${DB_PASSWORD}     # senha desse usuário
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"  # gera uma senha aleatória para o root

    # Volume nomeado: guarda os dados do banco FORA do container.
    # Se você apagar e recriar o container, os dados continuam lá.
    # (É o "volume persistente para o banco" exigido pela spec.)
    volumes:
      - db_data:/var/lib/mysql

    # Verificação de saúde: a cada 5s roda "mysqladmin ping".
    # Se responder, o container é marcado como "healthy"; é isso que o
    # depends_on da API fica esperando.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s     # de quanto em quanto tempo testa
      timeout: 5s      # tempo máximo de espera por resposta
      retries: 10      # quantas falhas seguidas até considerar "unhealthy"

# Declaração dos volumes nomeados usados acima.
volumes:
  db_data:
