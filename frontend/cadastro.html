<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar conta | Loja de Plantas</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="cabecalho"></header>

  <main class="container">
    <section class="auth">
      <h1>Criar conta</h1>

      <form id="form-cadastro">
        <label for="name">Nome</label>
        <input type="text" id="name" name="name" autocomplete="name" maxlength="255" required>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" autocomplete="email" required>

        <label for="password">Senha (mínimo 8 caracteres)</label>
        <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>

        <label for="password_confirmation">Confirmar senha</label>
        <input type="password" id="password_confirmation" name="password_confirmation" autocomplete="new-password" minlength="8" required>

        <button type="submit">Criar conta</button>
      </form>

      <p id="mensagem" class="mensagem erro" role="alert"></p>
      <div id="avisos"></div>

      <p>Já tem conta? <a id="link-login" href="/login.html">Entrar</a></p>
    </section>
  </main>

  <script type="module" src="/js/cadastro.js"></script>
</body>
</html>
